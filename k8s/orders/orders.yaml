apiVersion: v1
kind: ServiceAccount
metadata:
  name: orders
---

apiVersion: v1
kind: Service
metadata:
  name: orders-service
spec:
  type: ClusterIP
  selector:
    app: orders
  ports:
    - port: 3002
      targetPort: 3002
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: orders
  template:
    metadata:
      annotations:
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: "orders"
        vault.hashicorp.com/agent-inject-secret-db: "secret/data/orders/db"
        vault.hashicorp.com/agent-inject-template-db: |
          {{- with secret "secret/data/orders/db" -}}
          export DATABASE_URL="{{ .Data.data.url }}"
          {{- end }}
      labels:
        app: orders
    spec:
      serviceAccountName: orders
      containers:
        - name: orders
          image: nodejs_express_microservices-orders:latest # Replace with your image
          command: ["sh", "-c", ". /vault/secrets/db && exec bun run app/orders/index.ts"]
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          ports:
            - containerPort: 3002
          env:
            - name: PORT
              value: "3002"
            - name: ORDERS_SERVICE_URL
              value: http://localhost:3002
            - name: ORDERS_ROUTE
              value: "/orders" 
          # K8s native probes replace Docker Compose healthchecks
          readinessProbe:
            httpGet:
              path: /health
              port: 3002
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 3002
            initialDelaySeconds: 10
            periodSeconds: 10


